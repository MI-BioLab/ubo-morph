[project]
name = "ubo-morph"
version = "1.0.0"
description = """
The official Python implementation of the face morphing algorithm described in
\"Decoupling texture blending and shape warping in face morphing\" by Ferrara et al.
"""
readme = "README.md"
authors = [
    { name = "ndido98", email = "ndido98@gmail.com" }
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=2.0.0,<2.5.0",
    "opencv-contrib-python>=5.0.0.93",
    "tqdm>=4.68.4",
]

[project.scripts]
ubo-morph = "ubo_morph.cli:main"

[project.optional-dependencies]
dlib = [
    "dlib>=20.0.1",
]
mediapipe = [
    "mediapipe>=0.10.35",
]
cupy = [
    "cupy-cuda12x[ctk]>=13.0",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/ubo_morph"]

[tool.semantic_release]
branch = "main"
build_command = """
python -m pip install --disable-pip-version-check uv==0.12.5
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
"""
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
version_toml = ["pyproject.toml:project.version"]

[tool.commitizen]
name = "cz_conventional_commits"

[tool.ty.analysis]
# CuPy is an optional accelerator and is intentionally absent from base CI.
allowed-unresolved-imports = ["cupy", "cupyx.**"]

[dependency-groups]
dev = [
    "commitizen>=4.13.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0",
    "ruff>=0.15.21",
    "ty>=0.0.59",
]
